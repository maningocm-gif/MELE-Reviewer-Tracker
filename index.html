function mockRender(){if(mockExam?.result)return mockResult();let q=mockExam?.questions?.[mockExam.i];if(!q)return mockPage();let pct=Math.round((mockExam.i/mockExam.questions.length)*100);return `<div class="mock-workspace"><div class="mock-top"><div><div class="eyebrow">Practice Simulation</div><h1 style="margin:4px 0">Mock Exam</h1><span class="muted">Question ${mockExam.i+1} of ${mockExam.questions.length}</span></div><div class="row"><b>${mockExam.timer!==null?fmt(mockExam.timer):'Untimed'}</b><button class="btn danger" data-stop-mock>End Exam</button></div></div><div class="mock-progress"><i style="width:${pct}%"></i></div><div class="card mock-question"><div class="row"><span class="pill">${esc(subj(q.subject)?.short||q.subject)}</span><span class="pill">${esc(q.topic)}</span><span class="pill">${esc(q.difficulty||'moderate')}</span>${q.source==='problem-set'?'<span class="pill mine">Source problem</span>':''}</div><div class="question">${esc(q.question)}</div>${(q.choices||[]).map((c,i)=>`<button class="btn mock-choice ${mockExam.answers[mockExam.i]===i?'selected':''}" data-mock-choice="${i}">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}<div class="row" style="justify-content:space-between;margin-top:18px"><button class="btn" data-mock-prev ${mockExam.i===0?'disabled':''}>Previous</button><button class="btn primary" data-mock-next>${mockExam.i===mockExam.questions.length-1?'End & Grade':'Next'}</button></div></div></div>`}
function finishMock(timeUp=false){if(!mockExam||mockExam.result)return;ensureV134();state.recentMockIds=[...(state.recentMockIds||[]),...mockExam.questions.map(q=>q.id)].slice(-Math.max(20,mockExam.questions.length*3));clearInterval(mockInterval);let correct=0;mockExam.questions.forEach((q,i)=>{let ans=mockExam.answers[i];let ok=ans!==undefined&&ans!==null&&q.choices?.[ans]===q.answer;if(ok)correct++;if(ans!==undefined){if(!ok)state.mistakes.push({id:uid('mist'),question:q.question,subject:q.subject,topic:q.topic,answer:q.choices?.[ans]||'',correct:q.answer,explanation:q.explanation||'',createdAt:Date.now(),resolved:false}) ;record(q,ok)}});state.sessions++;markStudyDay();save();mockExam.result={correct,total:mockExam.questions.length,percent:Math.round(correct/mockExam.questions.length*100),timeUp};renderView()}
function mockResult(){let r=mockExam.result;return `<div class="mock-workspace"><div class="card mock-result"><div class="eyebrow">Session Complete</div><div class="score">${r.percent}%</div><p><b>${r.correct} / ${r.total}</b> correct ${r.timeUp?'· Time expired':''}</p><p class="muted">Your result, attempts, and mistakes have been recorded.</p><div class="row"><button class="btn primary" data-restart-mock>Take Again</button><button class="btn" data-nav="practice">Practice Arena</button><button class="btn" data-nav="mistakes">Review Mistakes</button><button class="btn" data-nav="dashboard">Dashboard</button></div></div><div class="card mock-review"><h2>Answer Review</h2>${mockExam.questions.map((q,i)=>{let a=mockExam.answers[i],chosen=a==null?'Not answered':(q.choices?.[a]||'Not answered'),ok=chosen===q.answer;return `<div class="mock-review-item"><div class="row"><span class="pill">${i+1}</span><span class="pill">${esc(subj(q.subject)?.short||q.subject)}</span><span class="pill">${esc(q.topic)}</span><span class="pill ${ok?'easy':'difficult'}">${ok?'Correct':'Review'}</span></div><p><b>${esc(q.question)}</b></p><div class="mock-answer ${ok?'good':'bad'}"><b>Your answer:</b> ${esc(chosen)}<br><b>Correct answer:</b> ${esc(q.answer||'Answer not verified')}</div><p class="muted">${esc(q.explanation||'Review the source material and governing principle.')}</p></div>`}).join('')}</div></div>`}
function aceHistoryPage(){ensureV134();return `<h1>Ace Chat History</h1><p class="muted">Saved conversations stay on this device.</p><div class="list">${state.chatHistory.map(h=>`<div class="item"><div class="row"><b>${esc(h.title)}</b><span class="pill">${new Date(h.createdAt).toLocaleDateString()}</span></div><p class="muted">${esc((h.messages?.[h.messages.length-1]?.text||'').slice(0,180))}</p><button class="btn" data-open-chat="${h.id}">Open Chat</button><button class="btn danger" data-delete-chat="${h.id}">Delete</button></div>`).join('')||'<div class="card empty">No saved chats yet.</div>'}</div>`}
function acePage(){ensureV134();if(!window.aceCurrentId){let h=state.chatHistory[state.chatHistory.length-1];window.aceCurrentId=h?.id||uid('chat');if(!h)state.chatHistory.push({id:window.aceCurrentId,title:'New chat',createdAt:Date.now(),messages:[]})}let h=state.chatHistory.find(x=>x.id===window.aceCurrentId)||state.chatHistory[state.chatHistory.length-1];if(!h)return '';window.aceMessages=h.messages;return `<div class="row" style="justify-content:space-between"><div><h1>✦ Ace AI</h1><p class="muted">Your local MELE study companion.</p></div><div class="ace-actions"><button class="btn" data-new-chat>New Chat</button><button class="btn" data-nav="acehistory">Chat History</button></div></div><div class="ace-shell"><section class="card ace-chat"><div class="ace-head"><div class="ace-mark"><div class="ace-mark-icon">✦</div><div><h2 style="margin:0">${esc(h.title)}</h2><div class="muted">Ask directly. I’ll use the reviewer knowledge and your saved study data.</div></div></div></div><div class="ace-messages" id="aceMessages">${h.messages.length?h.messages.map(m=>`<div class="ace-msg ${m.role==='user'?'user':''}"><div class="role">${m.role==='user'?'You':'Ace'}</div>${esc(m.text)}</div>`).join(''):`<div class="empty">Start with a topic, a problem, or your progress.</div>`}</div><div class="ace-compose"><div class="ace-quick">${ACE_QUICK.map(([n,q])=>`<button class="btn" data-ace-quick="${esc(q)}">${esc(n)}</button>`).join('')}</div><textarea id="aceInput" placeholder="Ask Ace directly…"></textarea><div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Tip: ask “What should I study today?” or “Give me a harder torsion problem.”</span><button class="btn primary" data-ace-send>Ask Ace</button></div></div></section><aside class="ace-side"><div class="card"><h2>Study context</h2><div class="list"><div class="item">${Object.values(state.progress||{}).reduce((n,x)=>n+(+x.attempts||0),0)} practice attempts</div><div class="item">${(state.mistakes||[]).filter(x=>!x.resolved).length} unresolved mistakes</div><div class="item">${state.questions.length} reviewer questions</div><div class="item">${state.formulas.length} formulas</div></div></div><div class="quote-card">${dailyQuote()}</div></aside></div>`}
function sendAce(text){ensureV134();let t=(text||document.getElementById('aceInput')?.value||'').trim();if(!t)return;let h=state.chatHistory.find(x=>x.id===window.aceCurrentId);if(!h){window.aceCurrentId=uid('chat');h={id:window.aceCurrentId,title:t.slice(0,40),createdAt:Date.now(),messages:[]};state.chatHistory.push(h)}if(!h.messages.length)h.title=t.slice(0,40);h.messages.push({role:'user',text:t});h.messages.push({role:'ace',text:aceDirectReply(t)});save();renderView();bindContent();setTimeout(()=>{let m=document.getElementById('aceMessages');if(m)m.scrollTop=m.scrollHeight},0)}
function aceDirectReply(text){let q=aceNormalize(text);if(/what should i study|study today|what do i review/.test(q)){let rows=allTopics().map(x=>({x,p:statFor(x.name,x.subject)})).sort((a,b)=>a.p.p-b.p.p);let r=rows.find(x=>x.p.a>0)||rows[0];return `Today’s focus: ${r?.x.name||'start with a core topic'} (${subj(r?.x.subject)?.short||'MELE'}).\n\nPlan: 1) review the key concept, 2) solve 3 problems, 3) review every mistake. Keep the session focused.`}if(/harder|difficult|challenging|problem/.test(q)&&/torsion|bending|shaft|sheave|gear|machine/.test(q)){return `Try this: A solid circular shaft transmits 18 kW at 1,200 rpm. If the allowable shear stress is 55 MPa, determine the minimum shaft diameter using T = πτd³/16. Then state one assumption that could make the result unsafe in a real design.\n\nTip: convert power and speed to torque first, then check units before solving.`}if(/progress|accuracy|attempt|mistake|weak/.test(q)){let entries=Object.entries(state.progress||{}),a=entries.reduce((n,[,x])=>n+(+x.attempts||0),0),c=entries.reduce((n,[,x])=>n+(+x.correct||0),0),acc=a?Math.round(c/a*100):0;let weak=allTopics().map(x=>({x,p:statFor(x.name,x.subject)})).filter(z=>z.p.a>0).sort((a,b)=>a.p.p-b.p.p).slice(0,5);return `Here’s your current reviewer status:\n\n• ${a} practice attempts\n• ${acc}% recorded accuracy\n• ${(state.mistakes||[]).filter(x=>!x.resolved).length} unresolved mistakes\n• ${state.sessions||0} completed study sessions\n\nWeakest reviewed topics:\n${weak.length?weak.map((z,i)=>`${i+1}. ${z.x.name} — ${subj(z.x.subject)?.short||z.x.subject} — ${z.p.p}%`).join('\n'):'No scored topics yet.'}\n\nTip: don’t chase new topics until you repair the lowest-accuracy area.`}let hits=aceKnowledgeSearch(q);if(hits)return `Direct answer:\n\n${hits.split('\n').slice(0,5).join('\n')}\n\nTip: after reading, solve one problem without looking at the formula.`;if(/rankine/.test(q))return `Rankine cycle: pump → boiler → turbine → condenser.\n\nTip: track h values carefully and distinguish pump work from turbine work. For an idealized cycle, thermal efficiency is (W_t − W_p)/Q_in.`;if(/otto/.test(q))return `Otto cycle models spark-ignition engines. The ideal sequence is isentropic compression, constant-volume heat addition, isentropic expansion, and constant-volume heat rejection.\n\nTip: identify the process before choosing the equation.`;if(/diesel/.test(q))return `Diesel cycle uses constant-pressure heat addition in the ideal air-standard model.\n\nTip: do not substitute Otto-cycle heat-addition assumptions.`;if(/bernoulli/.test(q))return `Bernoulli relates pressure, velocity, and elevation for steady incompressible flow under its assumptions.\n\nTip: write the complete energy equation first, then decide which terms can actually be neglected.`;if(/continuity/.test(q))return `Continuity expresses mass conservation. For steady one-dimensional incompressible flow, A₁V₁ = A₂V₂.\n\nTip: if area decreases, velocity must increase for constant volumetric flow.`;if(/torsion/.test(q))return `For a circular shaft in elastic torsion, τ = Tr/J and T/J = τ/r.\n\nTip: convert power and rpm to torque before using the torsion relation.`;if(/bending stress/.test(q))return `Bending stress is commonly written σ = Mc/I.\n\nTip: use the distance from the neutral axis and the correct section moment of inertia.`;if(/hardness/.test(q))return `Hardness is resistance to localized plastic deformation or indentation. Brinell, Rockwell, and Vickers are common hardness tests.\n\nTip: hardness is not automatically the same thing as toughness or strength.`;if(/psychrometric/.test(q))return `Psychrometrics describes the thermodynamic properties and processes of moist air. Key properties include dry-bulb temperature, wet-bulb temperature, relative humidity, humidity ratio, enthalpy, and dew point.\n\nTip: identify the known air properties before choosing a chart relationship.`;if(/first law/.test(q))return `The First Law is conservation of energy. For a closed system with negligible kinetic and potential energy changes, one common convention is ΔU = Q − W.\n\nTip: always establish the system boundary and sign convention first.`;return `Let’s make this useful. Tell me the subject/topic or paste the exact problem. I can then give you: (1) the governing idea, (2) the formula if needed, (3) the solving steps, and (4) one exam tip. Avoid memorizing a formula before you know when it applies.`}

const baseBindContent134=bindContent;bindContent=function(){baseBindContent134();document.querySelectorAll('[data-start-mock]').forEach(b=>b.onclick=startMock);document.querySelectorAll('[data-mock-choice]').forEach(b=>b.onclick=()=>{if(mockExam)mockExam.answers[mockExam.i]=+b.dataset.mockChoice;renderView()});document.querySelectorAll('[data-mock-next]').forEach(b=>b.onclick=()=>{if(!mockExam)return;if(mockExam.i===mockExam.questions.length-1)finishMock(false);else{mockExam.i++;renderView()}});document.querySelectorAll('[data-mock-prev]').forEach(b=>b.onclick=()=>{if(mockExam&&mockExam.i>0){mockExam.i--;renderView()}});document.querySelectorAll('[data-stop-mock]').forEach(b=>b.onclick=()=>{if(confirm('End this exam now? Your answered questions will be graded.'))finishMock(false)});document.querySelectorAll('[data-restart-mock]').forEach(b=>b.onclick=restartMock);document.getElementById('mockCount')?.addEventListener('change',e=>{let w=document.getElementById('mockCustomWrap');if(w)w.style.display=e.target.value==='custom'?'grid':'none'});document.getElementById('mockMinutes')?.addEventListener('change',e=>{let w=document.getElementById('mockCustomMinWrap');if(w)w.style.display=e.target.value==='custom'?'grid':'none'});document.querySelectorAll('[data-restore-trash]').forEach(b=>b.onclick=()=>restoreTrash(b.dataset.restoreTrash));document.querySelectorAll('[data-purge-trash]').forEach(b=>b.onclick=()=>purgeTrash(b.dataset.purgeTrash));document.querySelectorAll('[data-new-chat]').forEach(b=>b.onclick=aceNewChat);document.querySelectorAll('[data-open-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.openChat));document.querySelectorAll('[data-delete-chat]').forEach(b=>b.onclick=()=>deleteChat(b.dataset.deleteChat));document.querySelector('[data-analyze-problems]')?.addEventListener('click',()=>{let t=document.getElementById('problemPaste')?.value.trim();if(!t)return toast('Paste a problem set first.');let c=distributeSourceText(t,'Pasted Problem Set');toast(`${c.questions} problems added to Practice Arena.`);render()});document.querySelector('[data-analyze-paste]')?.addEventListener('click',()=>{let t=document.getElementById('materialText')?.value.trim();if(!t)return toast('Paste text first.');let c=distributeSourceText(t,'Pasted Study Text');toast(`Added ${Object.values(c).reduce((a,b)=>a+b,0)} source-derived reviewer items.`);render()});document.querySelector('[data-read-link]')?.addEventListener('click',async()=>{let u=document.getElementById('materialUrl')?.value.trim();if(!u)return toast('Paste a URL first.');try{let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);let t=await r.text();let div=document.createElement('div');div.innerHTML=t;let text=div.innerText||div.textContent||'';let c=distributeSourceText(text,u);toast(`Read link and added ${Object.values(c).reduce((a,b)=>a+b,0)} items.`);render()}catch(e){toast('This site blocked browser reading. Paste the page text instead.')}});document.querySelector('[data-analyze-material]')?.addEventListener('click',()=>{});}
