/* v1.2.0 — Ace AI + personal design settings */
:root{--font-ui:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-display:Georgia,"Times New Roman",serif}
body{font-family:var(--font-ui)}h1,h2,.hero h1,.stat b,.question,.flash b{font-family:var(--font-display)}
body.design-paper{background:#f7f3ec} body.design-linen{background:#f3efe7;background-image:radial-gradient(#d9d0c2 .55px,transparent .55px);background-size:9px 9px} body.design-parchment{background:#f5f0e6;background-image:linear-gradient(90deg,rgba(24,53,86,.025) 1px,transparent 1px);background-size:36px 36px} body.design-quiet{background:#f4f5f2}
.ace-shell{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.65fr);gap:18px}.ace-chat{min-height:620px;display:flex;flex-direction:column}.ace-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:15px;border-bottom:1px solid var(--line)}.ace-mark{display:flex;align-items:center;gap:12px}.ace-mark-icon{width:42px;height:42px;border:1px solid #b9ad9d;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;background:#f4ede2;color:var(--accent)}.ace-messages{flex:1;overflow:auto;padding:18px 3px;display:grid;gap:14px;align-content:start}.ace-msg{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel);white-space:pre-wrap}.ace-msg.user{margin-left:auto;background:var(--accent);color:#fff;border-color:var(--accent)}.ace-msg .role{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;opacity:.65;margin-bottom:4px}.ace-compose{border-top:1px solid var(--line);padding-top:14px}.ace-compose textarea{min-height:82px}.ace-quick{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.ace-quick button{font-size:12px}.ace-side{display:grid;gap:18px;align-content:start}.ace-note{background:#f4eee4;border-left:3px solid #b9ad9d;padding:13px;border-radius:8px;font-size:12px}.quote-card{background:#f1ebe1;border:1px solid var(--line);padding:18px;border-radius:14px}.quote-card blockquote{font:600 19px/1.45 var(--font-display);margin:8px 0;color:var(--accent)}.quote-card small{color:var(--muted)}.font-preview{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:10px}.serif-font{font-family:Georgia,"Times New Roman",serif}.editorial-font{font-family:"Palatino Linotype",Palatino,Georgia,serif}.classic-font{font-family:"Trebuchet MS",Arial,sans-serif}.book-font{font-family:"Times New Roman",Georgia,serif}.ace-suggestion{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:900px){.ace-shell{grid-template-columns:1fr}.ace-chat{min-height:560px}.ace-msg{max-width:92%}}

/* v1.3.2 — responsive editorial dashboard polish */
.dashboard-shell{max-width:1180px;margin:0 auto;padding-bottom:40px}
.dashboard-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.75fr);gap:22px;align-items:stretch;margin-bottom:28px}
.dashboard-welcome{padding:34px 36px;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(40,38,33,.035)}
.dashboard-welcome:after{content:"";position:absolute;right:-45px;top:-55px;width:170px;height:170px;border:1px solid rgba(24,53,86,.08);border-radius:50%;box-shadow:0 0 0 24px rgba(24,53,86,.025),0 0 0 48px rgba(24,53,86,.018)}
.dashboard-welcome h1{font-size:clamp(34px,4vw,52px);line-height:1.05;letter-spacing:-.025em;margin:8px 0 12px;max-width:700px}
.dashboard-welcome .lead{font-size:15px;max-width:620px;color:var(--muted);margin:0}
.dashboard-kicker{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.dashboard-kicker:before{content:"";width:28px;height:1px;background:#b9ad9d}
.dashboard-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.dashboard-meta .pill{background:var(--panel-soft)}
.dashboard-quote{display:flex;flex-direction:column;justify-content:center;padding:26px 28px;background:var(--panel-soft);border:1px solid var(--line);border-radius:18px;min-height:100%}
.dashboard-quote blockquote{font:600 clamp(18px,2vw,23px)/1.42 var(--font-display);margin:10px 0 12px;color:var(--accent)}
.dashboard-quote small{color:var(--muted)}
.dashboard-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:30px}
.dashboard-stat{padding:20px 21px;min-height:142px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);background:var(--panel);border-radius:15px;box-shadow:none}
.dashboard-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.dashboard-stat .value{font:600 clamp(27px,3vw,38px)/1 var(--font-display);color:var(--accent);margin:10px 0 4px}
.dashboard-stat .sub{font-size:12px;color:var(--muted)}
.dashboard-stat .mini-line{height:3px;background:var(--panel-soft);border-radius:999px;overflow:hidden;margin-top:12px}
.dashboard-stat .mini-line i{display:block;height:100%;background:var(--accent);border-radius:999px}
.dashboard-section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 13px}
.dashboard-section-head h2{margin:0;font-size:25px}
.dashboard-section-head .muted{font-size:12px}
.dashboard-subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:30px}
.dashboard-subject-card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:15px;align-items:center;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:15px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.dashboard-subject-card:hover{transform:translateY(-2px);border-color:#cfc5b8;box-shadow:0 8px 22px rgba(40,38,33,.045)}
.dashboard-subject-icon{width:52px;height:52px;border-radius:12px;border:1px solid #d9d0c3;background:#f1ebe1;display:grid;place-items:center;color:var(--accent);font:600 21px var(--font-display)}
.dashboard-subject-card h3{font-size:16px;margin:0 0 3px;line-height:1.3}
.dashboard-subject-card .subject-meta{font-size:12px;color:var(--muted)}
.dashboard-subject-card .subject-score{text-align:right;font:600 22px var(--font-display);color:var(--accent)}
.dashboard-subject-card .subject-score small{display:block;font:11px var(--font-ui);color:var(--muted);margin-top:3px}
.dashboard-subject-card .bar{margin-top:11px;height:5px}
.dashboard-lower{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:22px;align-items:start}
.dashboard-weak-list{display:grid;gap:9px}
.dashboard-weak-card{display:grid;grid-template-columns:30px minmax(0,1fr) 90px;gap:13px;align-items:center;padding:14px 15px;border:1px solid var(--line);background:var(--panel);border-radius:13px}
.dashboard-rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f2e7df;color:var(--bad);font-size:11px;font-weight:800}
.dashboard-weak-card h3{margin:0;font-size:14px;line-height:1.3}
.dashboard-weak-card .topic-sub{font-size:11px;color:var(--muted);margin-top:2px}
.dashboard-weak-score{text-align:right;font-size:12px;font-weight:800;color:var(--bad)}
.dashboard-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dashboard-action{min-height:94px;text-align:left!important;padding:16px!important;border:1px solid var(--line)!important;background:var(--panel)!important;border-radius:13px!important;color:var(--text)!important}
.dashboard-action:hover{border-color:#c9bdaf!important;background:#fbf7f0!important}
.dashboard-action .action-mark{font:600 18px var(--font-display);color:var(--accent);display:block;margin-bottom:8px}
.dashboard-action b{font-size:13px}
.dashboard-action small{display:block;margin-top:3px}
.dashboard-exam{margin:28px 0 0;padding:19px 22px;border:1px solid #d8cbb9;border-radius:15px;background:#f4ede3;display:flex;align-items:center;justify-content:space-between;gap:20px}
.dashboard-exam b{font:600 19px var(--font-display);color:var(--accent)}
.dashboard-exam p{margin:3px 0 0;color:var(--muted);font-size:13px}
.dashboard-footer-note{margin-top:28px;padding:15px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}

@media(max-width:1050px){
 .dashboard-hero{grid-template-columns:1fr}
 .dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .dashboard-lower{grid-template-columns:1fr}
}
@media(max-width:720px){
 .dashboard-shell{padding-bottom:18px}
 .dashboard-welcome{padding:26px 22px;border-radius:15px}
 .dashboard-welcome h1{font-size:35px}
 .dashboard-quote{padding:22px;border-radius:15px}
 .dashboard-stats{grid-template-columns:1fr 1fr;gap:9px}
 .dashboard-stat{min-height:120px;padding:16px}
 .dashboard-stat .value{font-size:28px}
 .dashboard-subjects{grid-template-columns:1fr}
 .dashboard-subject-card{grid-template-columns:46px minmax(0,1fr) auto;gap:12px;padding:16px}
 .dashboard-subject-icon{width:46px;height:46px}
 .dashboard-lower{gap:25px}
 .dashboard-quick{grid-template-columns:1fr 1fr}
 .dashboard-exam{align-items:flex-start;flex-direction:column}
}
@media(max-width:480px){
 .dashboard-stats{grid-template-columns:1fr 1fr}
 .dashboard-stat{min-height:112px;padding:14px 13px}
 .dashboard-stat .label{font-size:9px;letter-spacing:.06em}
 .dashboard-stat .value{font-size:25px}
 .dashboard-stat .sub{font-size:10px}
 .dashboard-subject-card{grid-template-columns:42px minmax(0,1fr);}
 .dashboard-subject-icon{width:42px;height:42px;font-size:18px}
 .dashboard-subject-card .subject-score{grid-column:2;text-align:left;margin-top:-5px}
 .dashboard-subject-card .subject-score small{display:inline;margin-left:5px}
 .dashboard-weak-card{grid-template-columns:28px minmax(0,1fr);}
 .dashboard-weak-score{grid-column:2;text-align:left}
 .dashboard-quick{grid-template-columns:1fr}
 .dashboard-section-head{align-items:flex-start;flex-direction:column;gap:5px}
}
@media(min-width:901px){.main{padding-left:34px;padding-right:34px}.top{max-width:1180px;margin:0 auto 10px}}

function clone(x){return JSON.parse(JSON.stringify(x))} function normalizeState(){const base={terms:[],formulas:[],notes:[],questions:[],flashcards:[],situations:[],materials:[],mistakes:[],progress:{},saved:[],settings:{theme:'system'},sessions:0};state={...base,...state};for(const k of ['terms','formulas','notes','questions','flashcards','situations','materials','mistakes','saved'])if(!Array.isArray(state[k]))state[k]=[];if(!state.progress||typeof state.progress!=='object'||Array.isArray(state.progress))state.progress={};if(!state.settings||typeof state.settings!=='object')state.settings={theme:'system'};if(!['system','light','dark'].includes(state.settings.theme))state.settings.theme='system';if(!['paper','linen','parchment','quiet'].includes(state.settings.bgDesign))state.settings.bgDesign='paper';if(!['system','classic','editorial','book'].includes(state.settings.fontDesign))state.settings.fontDesign='system';state.sessions=Number.isFinite(+state.sessions)?Math.max(0,+state.sessions):0} function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Browser storage is full; your current session may not persist.')}} function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')state={...state,...x}}catch(e){state={terms:[],formulas:[],notes:[],questions:[],flashcards:[],situations:[],materials:[],mistakes:[],progress:{},saved:[],settings:{theme:'system'},sessions:0}} normalizeState() }

function renderView(){let c=document.getElementById('content'); if(view==='dashboard')c.innerHTML=dashboard();else if(view==='ace')c.innerHTML=acePage();else if(view==='subjects')c.innerHTML=subjectsPage();else if(view==='practice')c.innerHTML=practicePage();else if(view==='formulas')c.innerHTML=formulasPage();else if(view==='terms')c.innerHTML=collectionPage('terms','Terms');else if(view==='notes')c.innerHTML=collectionPage('notes','Notes');else if(view==='situations')c.innerHTML=collectionPage('situations','Engineering Situations');else if(view==='mistakes')c.innerHTML=mistakesPage();else if(view==='weak')c.innerHTML=weakPage();else if(view==='progress')c.innerHTML=progressPage();else if(view==='saved')c.innerHTML=savedPage();else if(view==='timer')c.innerHTML=timerPage();else if(view==='materials')c.innerHTML=materialsPage();else if(view==='flashcards')c.innerHTML=flashPage();else c.innerHTML=settingsPage();bindContent()}
function dashboard(){let topics=allTopics(),totalTopics=topics.length,answered=topics.reduce((n,x)=>n+statFor(x.name,x.id).a,0),correct=topics.reduce((n,x)=>n+statFor(x.name,x.id).c,0),accuracy=answered?Math.round(correct/answered*100):0,overall=totalTopics?Math.round(topics.reduce((n,x)=>n+statFor(x.name,x.id).p,0)/totalTopics):0,studied=topics.filter(x=>statFor(x.name,x.id).a>0).length,weak=topics.map(x=>({x,p:statFor(x.name,x.id)})).filter(z=>z.p.a===0||z.p.p<75).sort((a,b)=>a.p.p-b.p.p).slice(0,3);return `<div class="row" style="justify-content:space-between;margin-bottom:18px"><div><div class="eyebrow">Mechanical Engineering Licensure Review</div><h1>Good study session, Engineer.</h1><p class="muted" style="margin:0">Build understanding, solve deliberately, and let your progress tell the story.</p></div><span class="pill">${APP_VERSION} · Offline</span></div><div class="card hero"><div class="grid g4"><div class="stat"><span>Overall Progress</span><b>${overall}%</b><div class="bar" style="margin:10px 0 6px"><i style="width:${overall}%"></i></div><small class="muted">${studied} / ${totalTopics} topics studied</small></div><div class="stat"><span>Questions Answered</span><b>${answered}</b><small class="muted">${correct} correct</small></div><div class="stat"><span>Average Accuracy</span><b>${accuracy}%</b><small class="muted">Based on recorded attempts</small></div><div class="stat"><span>Study Sessions</span><b>${state.sessions}</b><small class="muted">Completed timer sessions</small></div></div></div><div class="section"><h2>Subject Progress</h2><button class="btn" data-nav="subjects">View all</button></div><div class="card"><div class="list">${SUBJECTS.map((s,i)=>{let st=topicsFor(s).map(t=>statFor(t,s.id)),a=st.reduce((n,p)=>n+p.a,0),c=st.reduce((n,p)=>n+p.c,0),pct=a?Math.round(c/a*100):0;return `<div class="subject-row"><div class="subject-mark">${['∑','fx','M','R','A'][i]}</div><div><h3>${esc(s.name)}</h3><small class="muted">${topicsFor(s).length} syllabus topics</small></div><div class="bar-wrap"><div class="bar"><i style="width:${pct}%"></i></div><small class="muted">${a?`${a} attempts · ${pct}% accuracy`:'Not yet practiced'}</small></div><div class="subject-pct" style="font:600 20px var(--serif);text-align:right;color:var(--accent)">${pct}%</div></div>`}).join('')}</div></div><div class="dashboard-grid"><div><div class="section"><h2>Weakest Topics</h2><button class="btn" data-nav="weak">View all</button></div><div class="card">${weak.length?weak.map((z,i)=>`<div class="weak-row"><span class="rank">${i+1}</span><div><b>${esc(z.x.name)}</b><div><small class="muted">${esc(subj(z.x.id)?.short||z.x.id)}</small></div></div><div class="bar-wrap"><div class="bar"><i style="width:${z.p.p}%"></i></div></div><span style="font-weight:700;color:var(--bad)">${z.p.a?z.p.p+'%':'—'}</span></div>`).join(''):'<div class="empty">Start practicing to identify your weakest topics.</div>'}</div></div><div><div class="section"><h2>Quick Actions</h2></div><div class="card quick-actions"><button class="btn" data-nav="practice"><b>Practice Arena</b><br><small class="muted">Choose a subject and difficulty</small></button><button class="btn" data-nav="formulas"><b>Formula Bank</b><br><small class="muted">Review governing equations</small></button><button class="btn" data-nav="timer"><b>Study Timer</b><br><small class="muted">Start a focused session</small></button><button class="btn" data-nav="materials"><b>My Materials</b><br><small class="muted">Build from your own reviewers</small></button></div></div></div><div class="section"><h2>Reviewer Philosophy</h2></div><div class="grid g3"><div class="card"><div class="eyebrow">Learn</div><h3>Understand first</h3><p class="muted">Use definitions, notes, assumptions, units, and physical meaning before reaching for a formula.</p></div><div class="card"><div class="eyebrow">Apply</div><h3>Practice with purpose</h3><p class="muted">Move from concepts to numerical problems and engineering situations across each subject.</p></div><div class="card"><div class="eyebrow">Repair</div><h3>Study what you miss</h3><p class="muted">Mistakes and weak-topic data should determine what deserves another review.</p></div></div><div class="disclaimer" style="margin-top:24px">Based on the provided Mechanical Engineering Board Examination syllabus reference. This is an independent study/reviewer tool and is not affiliated with or endorsed by PRC.</div>`}
function subjectsPage(){return `<h1>Subjects & Topics</h1><p class="muted">Every syllabus topic has a structured pack: concepts, terms, notes, formulas where applicable, worked examples, practice and traps.</p>${SUBJECTS.map(s=>`<div class="section"><h2>${esc(s.name)}</h2></div><div class="topicgrid">${topicsFor(s).map(t=>{let p=statFor(t,s.id);let n=state.notes.filter(x=>x.subject===s.id&&x.topic===t).length,f=state.formulas.filter(x=>x.subject===s.id&&x.topic===t).length,q=state.questions.filter(x=>x.subject===s.id&&x.topic===t).length;return `<div class="topiccard"><h3>${esc(t)}</h3><small>${n} notes • ${f} formulas • ${q} practice items</small><div style="margin:10px 0" class="bar"><i style="width:${p.p}%"></i></div><div class="row"><span class="pill">${p.p}%</span><button class="btn" data-topic="${esc(s.id+'|'+t)}">Study Topic</button></div></div>`}).join('')}</div>`).join('')}`}
function topicPage(sid,t){let terms=state.terms.filter(x=>x.subject===sid&&x.topic===t),forms=state.formulas.filter(x=>x.subject===sid&&x.topic===t),notes=state.notes.filter(x=>x.subject===sid&&x.topic===t),qs=state.questions.filter(x=>x.subject===sid&&x.topic===t),p=statFor(t,sid);return `<div class="row"><button class="btn" data-nav="subjects">← Subjects</button><span class="pill">${esc(subj(sid)?.short||sid)}</span></div><h1 style="margin-top:14px">${esc(t)}</h1><p class="muted">${p.a?`${p.p}% accuracy across ${p.a} attempts`:'Not yet practiced'}</p><div class="bar"><i style="width:${p.p}%"></i></div><div class="tabs"><button class="active">Overview</button><button>Terms (${terms.length})</button><button>Formulas (${forms.length})</button><button>Practice (${qs.length})</button></div><div class="grid g2"><div class="card"><h2>What you need to know</h2><p>Start with definitions and physical meaning. Then learn the governing relation, assumptions, units, and failure/performance criterion. Finally solve timed problems and explain why the answer is reasonable.</p><h3>Key concepts</h3><ul><li>Define the system and known/unknown quantities.</li><li>State assumptions before calculating.</li><li>Track units and sign convention.</li><li>Check whether the result is physically plausible.</li></ul><h3>Common traps</h3><p>Formula memorization without applicability; unit mismatch; wrong geometry; wrong sign; and skipping the engineering check.</p></div><div class="card"><h2>Quick actions</h2><div class="row"><button class="btn primary" data-practice-topic="${esc(sid+'|'+t)}">Practice this topic</button><button class="btn" data-flash-topic="${esc(sid+'|'+t)}">Flashcards</button></div><div class="section"><h2>Formula snapshot</h2></div>${forms.slice(0,4).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="formula">${esc(x.formula)}</div><p class="muted">${esc(x.use)}</p></div>`).join('')||'<p class="muted">This topic is primarily concept/procedure based; use notes, standards, diagrams and practice.</p>'}</div></div><div class="section"><h2>Topic Notes</h2></div><div class="list">${notes.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><p>${esc(n.quick).replace(/\n/g,'<br>')}</p><details><summary>Detailed explanation</summary><p>${esc(n.detailed)}</p><p><b>Remember:</b> ${esc(n.important)}</p><p><b>Common mistakes:</b> ${esc(n.mistakes)}</p><p><b>Exam tips:</b> ${esc(n.tips)}</p><p><b>Situation:</b> ${esc(n.situational)}</p></details></div>`).join('')}</div>`}
function collectionPage(key,title){let a=state[key]||[];return `<h1>${title}</h1><p class="muted">Built-in content is labeled BUILT-IN. Your additions are labeled MY CONTENT.</p><div class="list">${a.map(x=>`<div class="item"><div class="row"><span class="pill ${x.builtIn===false?'mine':'built'}">${x.builtIn===false?'MY CONTENT':'BUILT-IN'}</span><span class="pill">${esc(subj(x.subject)?.short||x.subject)}</span><span class="pill">${esc(x.topic||'')}</span></div><h3>${esc(x.title||x.term||x.front||'Untitled')}</h3><p>${esc(x.definition||x.quick||x.detailed||x.front||x.question||'')}</p><button class="btn" data-open="${esc(x.id)}">Open</button></div>`).join('')||'<div class="card empty">No content yet.</div>'}</div>`}
function formulasPage(){return `<h1>Formula Bank</h1><p class="muted">Each formula includes variables, use/not-use guidance, example, solution and common traps.</p><div class="grid g3">${SUBJECTS.map(s=>`<div class="card"><h3>${esc(s.short)}</h3><b>${state.formulas.filter(f=>f.subject===s.id).length}</b> formulas<button class="btn" style="margin-top:10px" data-filter-formulas="${s.id}">View</button></div>`).join('')}</div><div class="section"><h2>All Formula Entries</h2></div><div class="list">${state.formulas.map(f=>`<div class="item"><div class="row"><span class="pill">${esc(subj(f.subject)?.short)}</span><span class="pill">${esc(f.topic)}</span><span class="pill ${f.difficulty}">${f.difficulty}</span></div><h3>${esc(f.title)}</h3><div class="formula">${esc(f.formula)}</div><p>${esc(f.use)}</p><button class="btn" data-open="${f.id}">Open full formula card</button></div>`).join('')}</div>`}
function practicePage(){if(practice)return practiceRender();let counts=Object.fromEntries(SUBJECTS.map(s=>[s.id,state.questions.filter(q=>q.subject===s.id).length]));return `<h1>Practice Arena</h1><p class="muted">Practice is organized by subject, then difficulty. Choose exactly what you want to drill, or let the adaptive system target weak areas.</p><div class="grid g3"><div class="card"><h3>🎯 Mixed Review</h3><p>Questions across all built-in subjects.</p><div class="count">${state.questions.length} total practice items</div><button class="btn primary" data-start-practice="mixed">Start Mixed Review</button></div><div class="card"><h3>🧠 Weak Topics</h3><p>Prioritizes topics below 75% accuracy.</p><button class="btn" data-start-practice="weak">Repair Weaknesses</button></div><div class="card"><h3>⚙️ Engineering Situations</h3><p>Decision-making and applied engineering judgment.</p><div class="practice-filter"><button class="btn" data-start-practice="situations">All Situations</button><button class="btn" data-start-practice="situations|math">Math</button><button class="btn" data-start-practice="situations|machine">Machine</button><button class="btn" data-start-practice="situations|power">Power</button><button class="btn" data-start-practice="situations|ref">Refrigeration</button><button class="btn" data-start-practice="situations|ac">Air Conditioning</button></div></div></div><div class="section"><h2>Practice by Subject</h2><span class="muted">Select a subject, then choose difficulty.</span></div><div class="grid g2">${SUBJECTS.map(s=>`<div class="card subject-practice"><div class="row"><div class="grow"><h3>${esc(s.name)}</h3><span class="count">${counts[s.id]||0} practice items</span></div><span class="pill">${esc(s.short)}</span></div><div class="practice-filter"><button class="btn primary" data-start-practice="${s.id}">Mixed</button><button class="btn" data-start-practice="${s.id}|easy">🟢 Easy</button><button class="btn" data-start-practice="${s.id}|moderate">🟡 Moderate</button><button class="btn" data-start-practice="${s.id}|difficult">🔴 Difficult</button><button class="btn" data-start-practice="${s.id}|situations">Situations</button></div></div>`).join('')}</div>`}
function practiceRender(){let q=practice.qs[practice.i];if(!q){let done={score:practice.score,total:practice.total};practice=null;return `<div class="card"><h1>Practice Complete</h1><p>Score: <b>${done.total?Math.round(done.score/done.total*100):0}%</b> (${done.score}/${done.total})</p><button class="btn primary" data-nav="practice">Back to Practice</button></div>`}return `<div class="row"><button class="btn" data-stop-practice>Exit</button><span class="pill">${practice.i+1}/${practice.total}</span><span class="pill">${esc(q.subject)}</span><span class="pill">${esc(q.topic)}</span><span class="pill ${q.difficulty}">${q.difficulty}</span><span class="pill">[${q.competency||'U'}]</span></div><div class="card" style="margin-top:15px"><div class="question">${esc(q.question)}</div>${q.type==='numerical'&&Number.isFinite(q.answer)?`<label>Your numerical answer<input id="numAns" type="number"></label><button class="btn primary" data-submit-num>Submit</button>`:q.type==='numerical'?`<div class="card"><b>Worked numerical drill</b><p>${esc(q.given)}</p><p><b>Do the calculation on paper.</b> Then reveal the worked solution.</p><button class="btn primary" data-reveal-numeric>Reveal solution</button></div>`:q.choices.map((c,i)=>`<button class="btn choice" data-answer-index="${i}">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}<div id="feedback" style="margin-top:15px"></div></div>`}
function startPractice(mode){let qs=state.questions.filter(q=>q.builtIn!==false);if(mode.startsWith('topic|')){let parts=mode.split('|');qs=qs.filter(q=>q.subject===parts[1]&&q.topic===parts[2])}else if(mode==='situations')qs=qs.filter(q=>q.type==='situation');else if(mode.startsWith('situations|')){let s=mode.split('|')[1];qs=qs.filter(q=>q.type==='situation'&&q.subject===s)}else if(mode==='weak')qs=qs.filter(q=>{let p=statFor(q.topic,q.subject);return p.a===0||p.p<75});else if(mode.includes('|')){let [s,d]=mode.split('|');qs=qs.filter(q=>q.subject===s&&(!d||q.difficulty===d))}else if(mode!=='mixed')qs=qs.filter(q=>q.subject===mode);qs=qs.filter(q=>q.type!=='numerical'||Number.isFinite(q.answer)||q.given);qs.sort((a,b)=>(statFor(a.topic,a.subject).p-statFor(b.topic,b.subject).p)+Math.random()-.5);practice={qs:qs.slice(0,15),i:0,score:0,total:Math.min(15,qs.length),answered:false};renderView();bindContent()}
function answerChoice(i){if(practice.answered)return;let q=practice.qs[practice.i],ok=q.choices[i]===q.answer;practice.answered=true;if(ok)practice.score++;record(q,ok);if(!ok)state.mistakes.push({id:uid('mist'),question:q.question,userAnswer:q.choices[i],correct:q.answer,explanation:q.explanation,subject:q.subject,topic:q.topic,date:Date.now(),difficulty:q.difficulty,competency:q.competency,resolved:false});save();document.querySelectorAll('[data-answer-index]').forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.answer)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="card ${ok?'correct':'wrong'}"><b>${ok?'CORRECT ✓':'WRONG'}</b><p>${esc(q.explanation)}</p>${q.formula?`<p><b>Formula/Principle:</b> ${esc(q.formula)}</p>`:''}<p><b>Engineering check:</b> ${esc(q.check||'')}</p><button class="btn primary" data-next-q>Next</button></div>`;document.querySelector('[data-next-q]').onclick=()=>{practice.i++;practice.answered=false;renderView();bindContent()}}
function revealNumeric(){let q=practice.qs[practice.i];practice.answered=true;document.getElementById('feedback').innerHTML=`<div class="card"><b>Worked solution</b><p><b>Given:</b> ${esc(q.given)}</p><p><b>Formula:</b> ${esc(q.formula)}</p><p><b>Solution:</b> ${esc(q.solution)}</p><p><b>Common mistake:</b> ${esc(q.mistake)}</p><button class="btn primary" data-next-q>Continue</button></div>`;document.querySelector('[data-next-q]').onclick=()=>{practice.i++;practice.answered=false;renderView();bindContent()}}
function mistakesPage(){return `<h1>Mistake Notebook</h1><p class="muted">Wrong answers are automatically saved with the question, answer, explanation, topic and difficulty.</p><div class="list">${state.mistakes.map(m=>`<div class="item ${m.resolved?'':'wrong'}"><div class="row"><span class="pill">${esc(m.topic)}</span><span class="pill">${esc(m.difficulty)}</span>${m.resolved?'<span class="pill easy">RESOLVED</span>':''}</div><h3>${esc(m.question)}</h3><p><b>Your answer:</b> ${esc(m.userAnswer)}</p><p><b>Correct:</b> ${esc(m.correct)}</p><p>${esc(m.explanation)}</p><button class="btn" data-resolve="${m.id}">${m.resolved?'Unresolve':'Mark Resolved'}</button></div>`).join('')||'<div class="card">No mistakes yet. That is either excellent or you have not practiced yet. 😄</div>'}</div>`}
function weakPage(){let a=allTopics().map(x=>({x,p:statFor(x.name,x.id)})).filter(z=>z.p.a===0||z.p.p<75).sort((a,b)=>a.p.p-b.p.p);return `<h1>Weak Topics</h1><div class="list">${a.map(z=>`<div class="item"><div class="row"><b>${esc(z.x.name)}</b><span class="pill">${esc(subj(z.x.subject)?.short)}</span></div><p>${z.p.a?`${z.p.p}% accuracy from ${z.p.a} attempts`:'Not attempted'}</p><div class="bar"><i style="width:${z.p.p}%"></i></div></div>`).join('')}</div>`}
function progressPage(){return `<h1>Progress</h1><div class="grid g3">${SUBJECTS.map(s=>{let ps=topicsFor(s).map(t=>statFor(t,s.id));let a=ps.reduce((x,p)=>x+p.a,0),c=ps.reduce((x,p)=>x+p.c,0);return `<div class="card"><h3>${esc(s.short)}</h3><b>${a?Math.round(c/a*100):0}%</b><p class="muted">${c}/${a} correct</p><div class="bar"><i style="width:${a?c/a*100:0}%"></i></div></div>`}).join('')}</div>`}
function savedPage(){let a=allItems().filter(x=>state.saved.includes(x.id));return `<h1>Saved Items</h1><div class="list">${a.map(x=>`<div class="item"><b>${esc(x.title||x.term||x.front)}</b><p class="muted">${esc(x.topic||'')}</p><button class="btn" data-open="${x.id}">Open</button></div>`).join('')||'<div class="card">No saved items yet.</div>'}</div>`}
function timerPage(){return `<h1>Study Timer</h1><div class="card"><div class="timer ${timer.done?'done':''}" id="timerDisplay">${fmt(timer.sec)}</div><div class="row" style="justify-content:center"><button class="btn ${timer.base===1500?'primary':''}" data-timer="1500">25 min</button><button class="btn ${timer.base===3000?'primary':''}" data-timer="3000">50 min</button><label style="max-width:120px">Custom min<input id="customMin" type="number" min="1" max="999" value="${Math.max(1,Math.round(timer.base/60))}"></label><button class="btn" data-custom-timer>Set</button></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" data-timer-start>${timer.running?'Pause':'Start'}</button><button class="btn" data-timer-reset>Reset</button></div><div class="row" style="justify-content:center;margin-top:14px"><label style="display:flex;align-items:center;gap:8px;margin:0;font-weight:600"><input id="timerSound" type="checkbox" ${timer.sound?'checked':''} style="width:auto"> 🔔 Play sound when finished</label></div><p class="muted" style="text-align:center">Completed sessions: ${state.sessions}</p><p class="muted" style="text-align:center;font-size:12px">The sound is generated locally by your browser. Your first Start click enables audio for the countdown alert.</p></div>`}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function timerBeep(){try{if(!timer.sound)return;let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let ctx=window._timerAudioCtx||(window._timerAudioCtx=new AC());if(ctx.state==='suspended')ctx.resume();let now=ctx.currentTime;[0,.22,.44].forEach((offset,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=i===2?1046.5:880;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.0001,now+offset);g.gain.exponentialRampToValueAtTime(0.22,now+offset+.02);g.gain.exponentialRampToValueAtTime(0.0001,now+offset+.18);o.start(now+offset);o.stop(now+offset+.2)});}catch(e){console.warn('Timer sound unavailable',e)}}
function unlockTimerAudio(){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;window._timerAudioCtx||(window._timerAudioCtx=new AC());if(window._timerAudioCtx.state==='suspended')window._timerAudioCtx.resume();}catch(e){}}
function startTimer(){if(timer.running){clearInterval(timer.interval);timer.running=false;renderView();bindContent();return}if(timer.sec<=0)timer.sec=timer.base;unlockTimerAudio();timer.done=false;timer.running=true;timer.interval=setInterval(()=>{timer.sec--;if(timer.sec<=0){timer.sec=0;clearInterval(timer.interval);timer.running=false;timer.done=true;state.sessions++;save();timerBeep();toast('⏰ Study session complete!');renderView();bindContent();return}updateTimerOnly()},1000);renderView();bindContent()}
function updateTimerOnly(){let e=document.getElementById('timerDisplay');if(e)e.textContent=fmt(timer.sec)}
function flashPage(){let a=flash.list.length?flash.list:state.flashcards.slice(0,20);let x=a[flash.i%a.length];return `<h1>Flashcards</h1>${a.length?`<div class="card flash"><div><span class="pill">${esc(x.topic)}</span><h2>${flash.show?esc(x.back):esc(x.front)}</h2><p class="muted">${flash.show?'Answer':'Tap Flip to reveal'}</p><div class="row" style="justify-content:center"><button class="btn" data-flip>Flip</button><button class="btn" data-fnext>Good / Next</button></div></div>`:'<div class="card">No flashcards.</div>'}`}
function materialsPage(){return `<h1>My Materials</h1><p class="muted">Upload your own reviewers, notes, PDFs, formulas and references. Files are treated as data and never executed.</p><div class="drop" id="drop"><b>📁 Drop materials here</b><p>or click to browse</p><small>PDF • TXT • CSV • JSON • Images</small><input id="fileInput" type="file" multiple accept=".pdf,.txt,.csv,.json,image/*" hidden></div><div class="section"><h2>Material Library</h2></div><div class="list">${state.materials.map(m=>`<div class="item"><div class="row"><span class="pill">${esc(m.kind)}</span><span class="pill">${esc(m.status||'Not Started')}</span></div><h3>${esc(m.name)}</h3><p class="muted">${esc(m.subject||'Uncategorized')} ${m.topic?'• '+esc(m.topic):''}</p><p>${m.size?Math.round(m.size/1024)+' KB':''}</p><div class="row"><button class="btn" data-open-material="${m.id}">Open</button>${m.extractedText?`<button class="btn primary" data-analyze-material="${m.id}">Analyze with Ace</button>`:''}<button class="btn" data-create-from-material="${m.id}">Create Reviewer Item</button><button class="btn danger" data-delete-material="${m.id}">Delete</button></div></div>`).join('')||'<div class="card">No materials uploaded yet.</div>'}</div>`}

function search(q){let low=q.toLowerCase();let a=allItems().filter(x=>JSON.stringify(x).toLowerCase().includes(low)).slice(0,80);openModal(`<div class="modalhead"><h2>Search: ${esc(q)}</h2><button class="btn" data-close>×</button></div>${a.map(x=>`<div class="item"><b>${esc(x.title||x.term||x.front)}</b><p class="muted">${esc(x.topic||'')} • ${esc(x.type)}</p><button class="btn" data-open="${x.id}">Open</button></div>`).join('')||'<p>No results.</p>'}`)}
function openModal(html){let d=document.createElement('div');d.className='modalback';d.id='modal';d.innerHTML='<div class="modal">'+html+'</div>';document.body.appendChild(d);d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.remove()});bindModal(d)}

function openItem(x){let body=x.type==='formula'?`<div class="formula">${esc(x.formula)}</div><p><b>Variables:</b> ${esc(x.variables)}</p><p><b>Use:</b> ${esc(x.use)}</p><p><b>Do not use:</b> ${esc(x.notUse)}</p><p><b>Example:</b> ${esc(x.example)}</p><p><b>Solution:</b> ${esc(x.solution)}</p><p><b>Common mistakes:</b> ${esc(x.mistakes)}</p>`:x.type==='note'?`<p>${esc(x.quick).replace(/\n/g,'<br>')}</p><p>${esc(x.detailed)}</p><p><b>Remember:</b> ${esc(x.important)}</p><p><b>Common mistakes:</b> ${esc(x.mistakes)}</p><p><b>Exam tips:</b> ${esc(x.tips)}</p>`:x.type==='flashcard'?`<div class="flash"><div><b>${esc(x.front)}</b><p>${esc(x.back)}</p></div></div>`:`<p>${esc(x.definition||x.question||x.back||'')}</p><p>${esc(x.explanation||x.technical||x.why||'')}</p>`;openModal(`<div class="modalhead"><div><span class="pill ${x.builtIn===false?'mine':'built'}">${x.builtIn===false?'MY CONTENT':'BUILT-IN'}</span><h2>${esc(x.title||x.term||x.front)}</h2></div><button class="btn" data-close>×</button></div><p class="muted">${esc(subj(x.subject)?.short||'')} • ${esc(x.topic||'')}</p>${body}<div class="row"><button class="btn" data-save-item="${x.id}">${state.saved.includes(x.id)?'★ Saved':'☆ Save'}</button></div>`)}

clearInterval(timer.interval);renderView();bindContent()});document.querySelector('[data-timer-start]')?.addEventListener('click',startTimer);document.querySelector('[data-timer-reset]')?.addEventListener('click',()=>{timer.running=false;timer.done=false;clearInterval(timer.interval);timer.sec=timer.base;renderView();bindContent()});document.getElementById('timerSound')?.addEventListener('change',e=>{timer.sound=e.target.checked;save();if(timer.sound)unlockTimerAudio();});document.querySelector('[data-export]')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mele-reviewer-backup.json';a.click();URL.revokeObjectURL(a.href)});document.getElementById('import')?.addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());state={...state,...x};mergeBuiltins();render();toast('Backup imported.')}catch(err){toast('Invalid backup file.')}});document.querySelector('[data-reset-progress]')?.addEventListener('click',()=>{if(confirm('Reset all practice progress and mistakes?')){state.progress={};state.mistakes=[];state.sessions=0;save();render()}});document.querySelector('[data-reset-all]')?.addEventListener('click',()=>{if(confirm('Delete ALL local reviewer data? This cannot be undone.')){localStorage.removeItem(KEY);location.reload()}});document.querySelector('[data-save-theme]')?.addEventListener('click',()=>{state.settings.theme=document.getElementById('theme').value;state.settings.bgDesign=document.getElementById('bgDesign')?.value||'paper';state.settings.fontDesign=document.getElementById('fontDesign')?.value||'system';save();applyTheme();applyDesign();toast('Appearance saved.')});let th=document.getElementById('theme');if(th)th.value=state.settings.theme;let bg=document.getElementById('bgDesign');if(bg)bg.value=state.settings.bgDesign||'paper';let fd=document.getElementById('fontDesign');if(fd)fd.value=state.settings.fontDesign||'system';document.querySelectorAll('[data-open-material]').forEach(b=>b.onclick=()=>openMaterial(b.dataset.openMaterial));document.querySelectorAll('[data-delete-material]').forEach(b=>b.onclick=()=>deleteMaterial(b.dataset.deleteMaterial));document.querySelectorAll('[data-create-from-material]').forEach(b=>b.onclick=()=>creator(b.dataset.createFromMaterial));document.querySelectorAll('[data-analyze-material]').forEach(b=>b.onclick=()=>{let m=state.materials.find(x=>x.id===b.dataset.analyzeMaterial);if(m?.extractedText)analyzeMaterialText(m.extractedText,m.name,m.id)});let drop=document.getElementById('drop'),fi=document.getElementById('fileInput');if(drop&&fi){drop.onclick=e=>{if(e.target!==fi)fi.click()};fi.onchange=e=>handleFiles([...e.target.files]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');handleFiles([...e.dataTransfer.files])}}document.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{flash.show=!flash.show;renderView();bindContent()});document.querySelectorAll('[data-fnext]').forEach(b=>b.onclick=()=>{flash.i++;flash.show=false;renderView();bindContent()});document.querySelectorAll('[data-flash-topic]').forEach(b=>{b.onclick=()=>{let [s,t]=b.dataset.flashTopic.split('|');flash.list=state.flashcards.filter(x=>x.subject===s&&x.topic===t);flash.i=0;flash.show=false;view='flashcards';renderView();bindContent()}});document.querySelectorAll('[data-save-item]').forEach(b=>b.onclick=()=>{let id=b.dataset.saveItem;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();toast(state.saved.includes(id)?'Saved.':'Removed from Saved.');openItem(allItems().find(x=>x.id===id))})}
function creator(materialId){let m=state.materials.find(x=>x.id===materialId);openModal(`<div class="modalhead"><h2>Create Reviewer Item</h2><button class="btn" data-close>×</button></div><p>Source: <b>${esc(m?.name||'Material')}</b></p><label>Type<select id="ct"><option value="term">Term</option><option value="formula">Formula</option><option value="note">Note</option><option value="question">Question</option><option value="flashcard">Flashcard</option><option value="situation">Situation</option></select></label><label>Subject<select id="cs">${SUBJECTS.map(s=>`<option value="${s.id}">${esc(s.short)}</option>`).join('')}</select></label><label>Topic<input id="cTopic" placeholder="Exact topic name"></label><label>Title / Front<textarea id="cTitle"></textarea></label><label>Content / Back / Question<textarea id="cBody"></textarea></label><button class="btn primary" id="cSave">Save My Content</button>`);document.getElementById('cSave').onclick=()=>{let type=document.getElementById('ct').value,s=document.getElementById('cs').value,t=document.getElementById('cTopic').value.trim(),title=document.getElementById('cTitle').value.trim(),body=document.getElementById('cBody').value.trim();if(!t||!title||!body){toast('Complete subject, topic and content.');return}let x={id:uid('my'),subject:s,topic:t,type,builtIn:false,custom:true,createdAt:Date.now(),sourceMaterialId:materialId};if(type==='term')Object.assign(x,{title,definition:body,technical:body,key:'Review your source material.',example:'User-provided.',importance:'Personal content.'});else if(type==='formula')Object.assign(x,{title,formula:body,variables:'See source material.',units:'See source material.',use:'See source material.',notUse:'See source material.',example:'User-provided.',solution:'Review source.',mistakes:'Check source assumptions.',difficulty:'moderate'});else if(type==='note')Object.assign(x,{title,quick:body,detailed:body,important:'From personal material.',mistakes:'Review source.',tips:'Use with built-in practice.',situational:'From personal material.'});else if(type==='flashcard')Object.assign(x,{front:title,back:body});else Object.assign(x,{title,question:body,choices:[],answer:'',explanation:'From personal material.',difficulty:'moderate',competency:'U'});let key={term:'terms',formula:'formulas',note:'notes',question:'questions',flashcard:'flashcards',situation:'situations'}[type]||'notes';state[key].push(x);save();document.getElementById('modal')?.remove();toast('MY CONTENT saved.');render()}}
async function openMaterial(id){let m=state.materials.find(x=>x.id===id);if(!m)return;let file=await getFile(id);if(!file){openModal(`<h2>${esc(m.name)}</h2><p>This material is catalogued, but the file bytes are no longer available in browser storage.</p>`);return}let url=URL.createObjectURL(file.blob);let body='';if(m.kind==='image')body=`<img src="${url}" style="max-width:100%;border-radius:12px">`;else if(m.kind==='pdf')body=`<iframe src="${url}" style="width:100%;height:65vh;border:0;border-radius:12px"></iframe>`;else if(m.kind==='text'||m.kind==='csv'||m.kind==='json'){let text=await file.blob.text();body=`<pre style="white-space:pre-wrap;max-height:65vh;overflow:auto">${esc(text)}</pre>`}else body=`<p>This file type can be catalogued, but browser preview is unavailable.</p>`;openModal(`<div class="modalhead"><h2>${esc(m.name)}</h2><button class="btn" data-close>×</button></div>${body}`)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putFile(id,blob){let db=await openDB();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({blob},id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function getFile(id){try{let db=await openDB();return await new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}async function deleteFile(id){try{let db=await openDB();db.transaction(STORE,'readwrite').objectStore(STORE).delete(id)}catch(e){}}
async function handleFiles(files){for(let f of files){let id=uid('mat'),ext=(f.name.split('.').pop()||'').toLowerCase(),kind=f.type==='application/pdf'?'pdf':f.type.startsWith('image/')?'image':ext==='csv'?'csv':ext==='json'?'json':ext==='txt'?'text':'file';let m={id,name:f.name,size:f.size,type:f.type,kind,status:'Not Started',subject:'Uncategorized',topic:'',createdAt:Date.now()};try{if(f.size>30*1024*1024){state.materials.push({...m,storage:'metadata-only',note:'File too large for reliable browser-local storage. Keep the original file on your device.'});toast(f.name+' catalogued; file too large to store locally.')}else{await putFile(id,f);state.materials.push({...m,storage:'indexeddb'})}}catch(e){state.materials.push({...m,storage:'metadata-only'});toast('Could not store '+f.name+' locally. Metadata kept.')}save()}render()}

const ACE_QUICK=[
 ['Explain the Rankine cycle','Explain the Rankine cycle in a board-review friendly way. Include the four ideal processes, key equations, efficiency, and common traps.'],
 ['Bernoulli equation','Explain the Bernoulli equation, assumptions, terms, units, and a short worked example.'],

 ['Torsion','Teach me torsion of circular shafts: equation, variables, assumptions, angle of twist, and common mistakes.'],
 ['Bending stress','Explain bending stress using σ = My/I, including neutral axis, units, and a simple example.'],
 ['Psychrometrics','Explain the basic psychrometric properties and how dry-bulb, wet-bulb, relative humidity, and humidity ratio relate.'],
 ['First Law','Explain the First Law of Thermodynamics for a closed system and steady-flow control volume.'],

];
const ACE_KB=[
 {keys:['rankine'],answer:`RANKINE CYCLE\n\nThe ideal Rankine cycle is the basic vapor-power cycle used to model steam power plants.\n\n1. 1→2: Isentropic pumping of condensate from condenser pressure to boiler pressure.\n2. 2→3: Constant-pressure heat addition in the boiler; water becomes superheated steam in a superheated cycle.\n3. 3→4: Isentropic expansion through the turbine, producing work.\n4. 4→1: Constant-pressure heat rejection in the condenser.\n\nThermal efficiency: η = (W_t − W_p) / Q_in.\n\nBoard-review trap: do not confuse turbine work with net cycle work. Pump work is normally much smaller than turbine work but is not zero.`},
 {keys:['otto','diesel'],answer:`OTTO / DIESEL CYCLES\n\nIdeal Otto cycle (spark-ignition): heat addition is modeled at constant volume. Its four ideal processes are isentropic compression, constant-volume heat addition, isentropic expansion, and constant-volume heat rejection.\n\nIdeal Diesel cycle (compression-ignition): heat addition is modeled at constant pressure. The processes are isentropic compression, constant-pressure heat addition, isentropic expansion, and constant-volume heat rejection.\n\nKey distinction: Otto → constant-volume heat addition; Diesel → constant-pressure heat addition.\n\nCommon trap: do not identify the real engine only from the idealized heat-addition process.`},
 {keys:['bernoulli'],answer:`BERNOULLI EQUATION\n\nFor steady, incompressible, inviscid flow along a streamline with no shaft work or heat-transfer effects represented in the basic form:\n\np/ρ + V²/2 + gz = constant\n\nOr between two points:\np₁/ρ + V₁²/2 + gz₁ = p₂/ρ + V₂²/2 + gz₂.\n\nTerms are pressure head/energy, velocity head, and elevation potential.\n\nIf pumps, turbines, or losses matter, the extended energy equation must include them.\n\nCommon trap: Bernoulli is not automatically valid for every real flow; check the assumptions and account for losses when required.`},
 {keys:['continuity','mass conservation'],answer:`CONTINUITY\n\nContinuity comes from conservation of mass. For steady one-dimensional flow:\nṁ = ρAV.\n\nFor incompressible flow with constant density:\nA₁V₁ = A₂V₂.\n\nIf area decreases, velocity increases for the same incompressible flow rate.\n\nExample: A₁ = 0.020 m² and V₁ = 3 m/s. If A₂ = 0.010 m², then V₂ = (A₁V₁)/A₂ = 6 m/s.`},
 {keys:['torsion'],answer:`TORSION\n\nFor a circular shaft in elastic torsion:\nτ = Tr/J\n\nMaximum shear stress occurs at the outer radius r = c:\nτ_max = Tc/J.\n\nAngle of twist:\nθ = TL/(JG)\n\nT = torque, r or c = radius, J = polar second moment of area, L = shaft length, G = shear modulus.\n\nFor a solid circular shaft: J = πd⁴/32.\n\nCommon traps: using the area moment of inertia I instead of the polar moment J, mixing diameter and radius, and ignoring unit consistency.`},
 {keys:['bending stress','flexure'],answer:`BENDING STRESS\n\nThe elastic flexure relation is:\nσ = My/I\n\nM = bending moment, y = distance from the neutral axis, I = area moment of inertia.\n\nMaximum bending stress occurs at the farthest fiber from the neutral axis:\nσ_max = Mc/I.\n\nFor a rectangular section about its centroidal strong axis:\nI = bh³/12.\n\nCommon trap: using the wrong axis or using J, the polar moment, in a bending problem.`},
 {keys:['hardness'],answer:`HARDNESS\n\nHardness is a material's resistance to localized plastic deformation such as indentation, scratching, or wear.\n\nCommon tests include Brinell, Rockwell, and Vickers.\n\nHardness is not the same as toughness. A hard material can still be relatively brittle.\n\nBoard trap: hardness is an indentation/deformation resistance property; toughness concerns energy absorbed before fracture.`},
 {keys:['psychrometric','psychrometrics','humidity ratio','relative humidity'],answer:`PSYCHROMETRICS\n\nPsychrometrics deals with the thermodynamic properties of moist air. Important properties include dry-bulb temperature, wet-bulb temperature, dew-point temperature, humidity ratio, relative humidity, specific volume, and enthalpy.\n\nDry-bulb temperature is the ordinary air temperature. Dew point is the temperature at which condensation begins during cooling at approximately constant pressure and humidity ratio. Relative humidity compares the actual vapor partial pressure with the saturation vapor pressure at the same temperature.\n\nCommon trap: relative humidity and humidity ratio are not the same quantity.`},
 {keys:['first law','first law of thermodynamics','thermodynamics first law'],answer:`FIRST LAW OF THERMODYNAMICS\n\nThe First Law is conservation of energy.\n\nFor a closed system, one common sign convention is:\nΔE = Q − W.\n\nIf kinetic and potential energy changes are negligible:\nΔU = Q − W.\n\nFor a steady-flow control volume, a common form is:\nQ̇ − Ẇ = ṁ[(h₂−h₁) + (V₂²−V₁²)/2 + g(z₂−z₁)].\n\nAlways check the sign convention and whether the problem is a closed system or control volume.`},
 {keys:['progress','mistakes','my progress','my mistakes','weak topics'],answerFn:()=>{let entries=Object.entries(state.progress||{}),attempts=entries.reduce((n,[,x])=>n+(+x.attempts||0),0),correct=entries.reduce((n,[,x])=>n+(+x.correct||0),0),acc=attempts?Math.round(correct/attempts*100):0;let weak=entries.map(([k,x])=>({k,p:(x.attempts?x.correct/x.attempts:1),a:x.attempts||0})).filter(x=>x.a>0).sort((a,b)=>a.p-b.p).slice(0,5);return `YOUR LOCAL REVIEW DATA\n\nQuestions answered: ${attempts}\nAverage accuracy: ${acc}%\nRecorded mistakes: ${(state.mistakes||[]).filter(x=>!x.resolved).length}\nStudy sessions: ${state.sessions||0}\n\n${weak.length?'Topics needing attention:\n'+weak.map((x,i)=>`${i+1}. ${x.k.replace('|',' — ')} (${Math.round(x.p*100)}% accuracy, ${x.a} attempts)`).join('\n'):'You have no scored topics yet. Start with a short Practice Arena session so Ace can identify your weak areas.'}\n\nTip: use the Weak Topics page after a few practice sessions for a more focused review.`}},
];
function aceNormalize(s){return s.toLowerCase().replace(/[^a-z0-9+\-\s]/g,' ').replace(/\s+/g,' ').trim()}
function aceReply(text){let q=aceNormalize(text);if(!q)return `Ask me a Mechanical Engineering question. I work locally from the reviewer knowledge built into this file.\n\nTry: “Explain Rankine cycle,” “Give me a torsion example,” or “What are my weak topics?”`;for(const item of ACE_KB){if(item.keys.some(k=>q.includes(aceNormalize(k))))return typeof item.answer==='function'?item.answer():item.answer}
if(/hello|hi|hey|good morning|good evening/.test(q))return `Hello, Engineer. I’m Ace — your private, local MELE study assistant.\n\nI can explain built-in MELE concepts, quiz you, and read your locally stored reviewer progress and mistakes. No cloud AI service is required.`;
if(/formula|equation/.test(q))return `I can help with formulas already built into the reviewer. Try naming the topic, such as torsion, bending stress, Bernoulli, continuity, Rankine, or psychrometrics.`;

function dashboard(){let topics=allTopics(),total=topics.length,answered=topics.reduce((n,x)=>n+statFor(x.name,x.subject).a,0),correct=topics.reduce((n,x)=>n+statFor(x.name,x.subject).c,0),accuracy=answered?Math.round(correct/answered*100):0,overall=total?Math.round(topics.reduce((n,x)=>n+statFor(x.name,x.subject).p,0)/total):0,studied=topics.filter(x=>statFor(x.name,x.subject).a>0).length,weak=topics.map(x=>({x,p:statFor(x.name,x.subject)})).filter(z=>z.p.a===0||z.p.p<75).sort((a,b)=>a.p.p-b.p.p).slice(0,3);ensureV130();let exam=state.settings.examDate?Math.max(0,Math.ceil((new Date(state.settings.examDate+'T00:00:00')-new Date())/86400000)):null;let today=new Date().toISOString().slice(0,10);let examMsg=state.settings.examDate===today?`<div class="card exam-card"><b>Exam day, Engineer.</b><p>${esc(state.settings.examMessage||'Take a breath, trust the work you put in, and give the examination your best. Good luck.')}</p></div>`:'';return `<div class="row" style="justify-content:space-between;margin-bottom:18px"><div><div class="eyebrow">Mechanical Engineering Licensure Review</div><h1>Good study session, Engineer.</h1><p class="muted" style="margin:0">Build understanding, solve deliberately, and let your progress tell the story.</p></div><span class="pill">v1.3.2 · Offline</span></div>${examMsg}<div class="grid g4"><div class="card stat"><span>Overall Progress</span><b>${overall}%</b><div class="bar"><i style="width:${overall}%"></i></div><small class="muted">${studied} / ${total} topics studied</small></div><div class="card stat"><span>Questions Answered</span><b>${answered}</b><small class="muted">${correct} correct</small></div><div class="card stat"><span>Average Accuracy</span><b>${accuracy}%</b><small class="muted">Recorded attempts</small></div><div class="card stat"><span>Study Streak</span><b>${streakCount()} day${streakCount()===1?'':'s'}</b><small class="muted">Keep the chain going</small></div></div><div class="section"><div class="row" style="justify-content:space-between"><h2>Subject Progress</h2><span class="muted">Actual saved practice data</span></div><div class="grid g2">${SUBJECTS.map(s=>{let ts=topicsFor(s).map(t=>statFor(t,s.id));let sp=ts.length?Math.round(ts.reduce((a,x)=>a+x.p,0)/ts.length):0;return `<div class="card dashboard-subject"><span class="subject-symbol">${subjectIcon(s.id)}</span><div class="grow"><div class="row"><b>${esc(s.short)}</b><span class="pill">${sp}%</span></div><div class="bar"><i style="width:${sp}%"></i></div><small class="muted">${ts.filter(x=>x.a>0).length} / ${ts.length} topics studied</small></div></div>`}).join('')}</div></div><div class="grid g2 section"><div><h2>Weakest Topics</h2><div class="grid g3 weak-grid">${weak.map(z=>`<div class="card weak-card"><div><span class="subject-symbol">${subjectIcon(z.x.subject)}</span><h3>${esc(z.x.name)}</h3><p class="muted">${esc(subj(z.x.subject)?.short||'')}</p></div><b>${z.p.p}% accuracy</b></div>`).join('')||'<div class="card">Start practicing to identify weak topics.</div>'}</div></div><div><h2>Quick Actions</h2><div class="grid g2"><button class="card btn" data-nav="practice">Practice Arena</button><button class="card btn" data-nav="mock">Mock Exam</button><button class="card btn" data-nav="formulas">Formula Bank</button><button class="card btn" data-nav="timer">Study Timer</button></div></div></div>${exam!==null?`<div class="card exam-card section"><b>${exam===0?'Exam day':'Exam countdown'}</b><p>${exam===0?'Today is the day.':`${exam} day${exam===1?'':'s'} until your exam.`}</p></div>`:''}`}

function startMock(){ensureV134();let sid=document.getElementById('mockSubject')?.value||'all',cnt=document.getElementById('mockCount')?.value||10;if(cnt==='custom')cnt=Math.max(1,+document.getElementById('mockCustom')?.value||10);let mins=document.getElementById('mockMinutes')?.value||0;if(mins==='custom')mins=Math.max(1,+document.getElementById('mockCustomMin')?.value||60);let mix=document.getElementById('mockMix')?.value||'all';let qs=state.questions.filter(q=>q.type==='mcq'&&(sid==='all'||q.subject===sid));if(mix!=='all')qs.sort((a,b)=>{let av=a.difficulty===mix?0:1,bv=b.difficulty===mix?0:1;return av-bv});qs=qs.sort(()=>Math.random()-.5).slice(0,Math.min(cnt,qs.length));if(!qs.length){toast('No multiple-choice questions available for that selection.');return}mockExam={questions:qs,i:0,answers:[],timer:mins?mins*60:null,startedAt:Date.now(),finished:false,config:{sid,cnt,mins,mix}};view='mock';render();if(mockExam.timer!==null){clearInterval(mockInterval);mockInterval=setInterval(()=>{if(!mockExam)return;mockExam.timer--;if(mockExam.timer<=0){mockExam.timer=0;clearInterval(mockInterval);finishMock(true)}else renderView()},1000)}}

function aceKnowledgeSearch(q){let tokens=aceNormalize(q).split(' ').filter(w=>w.length>2);let hits=allItems().map(x=>{let blob=JSON.stringify(x).toLowerCase();let score=tokens.reduce((n,t)=>n+(blob.includes(t)?1:0),0);return {x,score}}).filter(z=>z.score>0).sort((a,b)=>b.score-a.score).slice(0,6).map(z=>z.x);let materialHits=(state.materials||[]).map(m=>{let blob=String(m.extractedText||'').toLowerCase();let score=tokens.reduce((n,t)=>n+(blob.includes(t)?1:0),0);return {m,score}}).filter(z=>z.score>0).sort((a,b)=>b.score-a.score).slice(0,3);let out=hits.map(x=>`• ${x.title||x.term||x.front||x.question} — ${x.definition||x.quick||x.explanation||x.back||''}`);materialHits.forEach(({m})=>{let txt=String(m.extractedText||'');let low=txt.toLowerCase();let pos=tokens.map(t=>low.indexOf(t)).filter(i=>i>=0).sort((a,b)=>a-b)[0]??0;let snippet=txt.slice(Math.max(0,pos-120),Math.min(txt.length,pos+520));out.push(`• ${m.name} — source material: ${snippet}`)});return out.join('\n')}

function classifySubject(text){let q=String(text).toLowerCase();if(/rankine|boiler|turbine|condenser|steam power|otto|diesel|combustion|thermodynamic/.test(q))return 'power';if(/shaft|torsion|bending|stress|gear|bearing|bolt|sheave|pulley|machine design|fatigue|hardness/.test(q))return 'machine';if(/bernoulli|continuity|integral|derivative|laplace|matrix|calculus|probability/.test(q))return 'math';if(/refrigerant|compressor|evaporator|condenser|refrigeration|cop/.test(q))return 'ref';if(/psychrometric|humidity|air conditioning|sensible heat|latent heat|dry bulb|wet bulb/.test(q))return 'ac';return 'machine'}
function inferTopic(text,sid){let q=String(text).toLowerCase();let map={math:[['bernoulli','Fluid Mechanics'],['continuity','Fluid Mechanics'],['integral','Integral Calculus'],['derivative','Differential Calculus'],['laplace','Laplace Transform']],machine:[['torsion','Torsion'],['bending','Bending Stress'],['shaft','Shafts'],['gear','Gears'],['sheave','Belts and Pulleys'],['bolt','Fasteners'],['hardness','Material Properties']],power:[['rankine','Steam Power Plants — Cycles'],['otto','IC Engines — Otto Cycle'],['diesel','IC Engines — Diesel Cycle'],['boiler','Boilers and Steam Generators'],['turbine','Steam Turbines'],['thermodynamic','Thermodynamics']],ref:[['refriger','Refrigeration Cycle and COP'],['compressor','Compressors'],['evaporator','Evaporators'],['condenser','Condensers']],ac:[['psychrometric','Psychrometric Properties of Air'],['humidity','Psychrometric Properties of Air'],['air conditioning','Air-Conditioning Processes'],['sensible','Sensible and Latent Loads']]};for(const [k,t] of (map[sid]||[]))if(q.includes(k))return t;return topicsFor(subj(sid))[0]||'General'}
function extractMCQBlocks(text){let clean=String(text).replace(/\r/g,'');let lines=clean.split('\n');let blocks=[];for(let i=0;i<lines.length;i++){if(/^\s*(?:question\s*)?\d+[.)\-:]/i.test(lines[i])||/^\s*\d+[.)]/.test(lines[i])){let buf=[lines[i]],j=i+1,choices=0;for(;j<lines.length&&j<i+35;j++){buf.push(lines[j]);if(/^\s*[A-D][.)]\s+/i.test(lines[j]))choices++;if(choices>=4 && (/answer\s*[:\-]/i.test(lines[j+1]||'')||!lines[j+1]||/^\s*(?:question\s*)?\d+[.)]/i.test(lines[j+1]||'')))break}if(choices>=4)blocks.push(buf.join('\n'));i=j}}return blocks}
function parseMCQ(block,sourceName){let lines=block.split('\n').map(x=>x.trim()).filter(Boolean),choices=[],qLines=[],answerLetter='';for(const line of lines){let m=line.match(/^([A-D])[.)]\s*(.+)$/i);if(m)choices.push(m[2]);else {let a=line.match(/^(?:answer|correct answer|key)\s*[:\-]\s*([A-D])/i);if(a)answerLetter=a[1].toUpperCase();else qLines.push(line)}}let q=qLines.join(' ').replace(/^\d+[.)\-:]\s*/,'').trim();let sid=classifySubject(q);let topic=inferTopic(q,sid);let idx=answerLetter?answerLetter.charCodeAt(0)-65:-1;return {id:uid('srcq'),subject:sid,topic,type:'mcq',question:q,choices,answer:idx>=0&&choices[idx]?choices[idx]:'',explanation:'Imported from a user-provided problem set. Verify the answer against the source before relying on it.',difficulty:'difficult',competency:'A',builtIn:false,custom:true,source:'problem-set',sourceName,createdAt:Date.now(),verified:idx>=0&&!!choices[idx]}}
function distributeSourceText(text,name){ensureV134();let raw=String(text||'').replace(/\u0000/g,'').trim();if(!raw)return {terms:0,formulas:0,notes:0,questions:0,flashcards:0,situations:0};let sid=classifySubject(raw),topic=inferTopic(raw,sid),counts={terms:0,formulas:0,notes:0,questions:0,flashcards:0,situations:0};let qs=extractMCQBlocks(raw);for(const b of qs){let q=parseMCQ(b,name);state.questions.push(q);counts.questions++;let key=`${q.subject}|${q.topic}`;state.problemSets.push({id:uid('ps'),sourceName:name,text:b,subject:q.subject,topic:q.topic,createdAt:Date.now(),pattern:key})}
let formulaRe=/(?:[A-Za-zρσΔΩμλτφθ][A-Za-z0-9ρσΔΩμλτφθ₁₂²³]*\s*=\s*[^\n.;]{2,100})/g;let formulas=[...new Set((raw.match(formulaRe)||[]).map(x=>x.trim()).filter(x=>/[=]/.test(x)))].slice(0,18);for(const f of formulas){state.formulas.push({id:uid('srcf'),subject:sid,topic, type:'formula',title:`Source formula · ${topic}`,formula:f,variables:'See source material.',units:'See source material.',use:'Use only with the assumptions stated in the source.',notUse:'Do not use outside the source assumptions.',example:'From '+name,solution:'Review the source derivation.',mistakes:'Check units and assumptions.',difficulty:'moderate',builtIn:false,custom:true,source:'material',sourceName:name});counts.formulas++;}
let headingCandidates=raw.split('\n').map(x=>x.trim()).filter(x=>x.length>=8&&x.length<=90&&!/[.!?]$/.test(x)&&!/^[A-D][.)]/.test(x));let terms=[...new Set(headingCandidates.filter(x=>/^[A-Z0-9][A-Za-z0-9\- /()&]+$/.test(x)).slice(0,18))];for(const term of terms.slice(0,10)){state.terms.push({id:uid('srct'),subject:sid,topic,title:term,type:'term',definition:`Review ${term} using the uploaded source material “${name}”.`,technical:`Source-derived term. Use the source for the exact definition and context.`,key:'Focus on meaning, units, assumptions, and engineering use.',related:topic,confusion:'Check the source wording before substituting a familiar definition.',example:'From uploaded material.',importance:'Source-derived',difficulty:'moderate',builtIn:false,custom:true,sourceName:name});counts.terms++;}
let paragraphs=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(x=>x.length>120).sort((a,b)=>b.length-a.length).slice(0,5);for(const p of paragraphs){state.notes.push({id:uid('srcn'),subject:sid,topic,title:`Source note · ${topic}`,type:'note',quick:p.slice(0,420),detailed:p,important:'Source-derived note; verify against the uploaded material.',mistakes:'Do not omit stated assumptions.',tips:'Use this note as a study summary, then solve the related problems.',situational:'Apply the principle to a realistic engineering condition.',builtIn:false,custom:true,sourceName:name});counts.notes++;}
let termsAdded=state.terms.slice(-counts.terms);for(const t of termsAdded){state.flashcards.push({id:uid('srcfc'),subject:t.subject,topic:t.topic,type:'flashcard',front:t.title,back:t.definition,sourceName:name,builtIn:false,custom:true});counts.flashcards++;}
if(/failure|safety|vibration|overheat|leak|abnormal|maintenance|hazard|design|inspection/i.test(raw)){state.situations.push({id:uid('srcs'),subject:sid,topic,title:`Engineering situation · ${topic}`,type:'situation',question:`Based on the uploaded material “${name}”, identify the governing engineering principle, the key data you would verify, and the safest next action.`,choices:['Apply the stated principle and verify assumptions/data first.','Ignore operating conditions and use the first familiar formula.','Skip verification and change components immediately.','Assume the source conditions always apply.'],answer:'Apply the stated principle and verify assumptions/data first.',explanation:'This is a source-inspired reasoning exercise. Use the uploaded material to justify the decision.',difficulty:'difficult',competency:'E',builtIn:false,custom:true,sourceName:name});counts.situations++}
save();return counts}
async function extractReadableFile(file){let ext=(file.name.split('.').pop()||'').toLowerCase();if(['txt','md','csv','json'].includes(ext)||file.type.startsWith('text/'))return await file.text();if(ext==='pdf'||file.type==='application/pdf'){let buf=await file.arrayBuffer();let raw=new TextDecoder('latin1').decode(buf);let chunks=[];let re=/\(([^()]*)\)\s*Tj/g,m;while((m=re.exec(raw)))chunks.push(m[1]);let joined=chunks.join(' ');return joined.length>100?joined:''}return ''}

async function handleFiles(files){ensureV134();for(const f of files){let id=uid('mat'),ext=(f.name.split('.').pop()||'').toLowerCase(),kind=f.type==='application/pdf'?'pdf':f.type.startsWith('image/')?'image':['csv','json','txt','md'].includes(ext)?ext:'file';let m={id,name:f.name,size:f.size,type:f.type,kind,status:'Analyzing…',subject:'Uncategorized',topic:'',createdAt:Date.now(),storage:'indexeddb'};try{if(f.size<=30*1024*1024)await putFile(id,f);else m.storage='metadata-only';let text=await extractReadableFile(f);m.extractedText=text;m.status=text?'Analyzed':'Needs review';if(text){let c=distributeSourceText(text,f.name);m.analysis=c;m.subject=classifySubject(text);m.topic=inferTopic(text,m.subject);toast(`${f.name}: ${c.questions+c.notes+c.formulas+c.terms+c.flashcards+c.situations} reviewer items added.`)}else if(kind==='image'){m.status='Image stored — OCR not available in this single-file build';toast(`${f.name} stored. Images need OCR outside the single-file reader.`)}else toast(`${f.name} stored, but readable text could not be extracted automatically.`);state.materials.push(m)}catch(e){m.status='Stored with limited analysis';state.materials.push(m);toast('Could not fully analyze '+f.name+'.')}save()}render()}

ted">${esc(m.topic||'Unassigned topic')}</p>${m.analysis?`<p class="source-tag">Added: ${Object.entries(m.analysis).filter(([,v])=>v).map(([k,v])=>k+' '+v).join(' · ')}</p>`:''}<div class="row" style="margin-top:10px"><button class="btn" data-open-material="${m.id}">Open</button>${m.extractedText?`<button class="btn primary" data-analyze-material="${m.id}">Analyze with Ace</button>`:''}<button class="btn" data-create-from-material="${m.id}">Create Reviewer Item</button><button class="btn danger" data-delete-material="${m.id}">Delete</button></div></div>`).join('')||'<div class="card empty">No materials yet.</div>'}</div>`}

function buildMockQuestions(c){ensureV134();let pool=state.questions.filter(q=>q.type==='mcq'&&q.answer&&Array.isArray(q.choices)&&q.choices.length>=4&&(c.sid==='all'||q.subject===c.sid));let recent=state.recentMockIds||[];pool.sort((a,b)=>(recent.includes(a.id)?1:0)-(recent.includes(b.id)?1:0));let bySource=[...pool].sort((a,b)=>(a.source==='problem-set'?0:1)-(b.source==='problem-set'?0:1));if(c.mix!=='all')bySource.sort((a,b)=>(a.difficulty===c.mix?0:1)-(b.difficulty===c.mix?0:1));return bySource.sort(()=>Math.random()-.5).slice(0,Math.min(+c.cnt,bySource.length))}
